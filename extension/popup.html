<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>WHOAPED</title><link rel="stylesheet" href="popup.css" /></head>
  <body>
    <main class="window">
      <header><span class="app-icon">WA</span><b>WHOAPED Companion</b><span class="window-controls" aria-hidden="true">_ □ ×</span></header>
      <section class="window-body">
        <p class="dialog-copy">Enter a wallet you independently verified.</p>
        <label>WHOAPED server<input id="endpoint" placeholder="WHOAPED app URL" spellcheck="false" /></label>
        <label>Solana wallet<input id="wallet" placeholder="Public wallet address" spellcheck="false" /></label>
        <button id="open">Analyze Wallet</button>
        <aside>On Pump profiles, the inline window calculates live Follower Edge automatically.</aside>
      </section>
      <footer><span class="status-light"></span> Ready</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
